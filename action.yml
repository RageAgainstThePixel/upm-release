name: upm-release
description: 'A GitHub action to sign and release a Unity upm package.'
branding:
  icon: gift
  color: blue
inputs:
  organization-id:
    description: 'Unity Cloud organization id used for signing. Omit if `UNITY_ORG_ID` / `UNITY_ORGANIZATION_ID` is set in the environment.'
    required: false
  upm-service-account-key-id:
    description: 'Service account key id. Omit if `UPM_SERVICE_ACCOUNT_KEY_ID` is set in the environment.'
    required: false
  upm-service-account-key-secret:
    description: 'Service account key secret. Omit if `UPM_SERVICE_ACCOUNT_KEY_SECRET` is set in the environment.'
    required: false
  package-json:
    description: 'Path glob for `package.json`. Default: `**/Packages/**/package.json`.'
    required: false
  release-title:
    description: 'GitHub release title; default from package name and version.'
    required: false
  release-notes:
    description: 'Release body; default from the target commit message.'
    required: false
  github-token:
    description: 'Token for creating the release and uploading the asset. Defaults to `GITHUB_TOKEN`.'
    required: false
  split-upm-branch:
    description: 'Branch name for `git subtree split`, or `none` to disable. Default: `upm`.'
    required: false
    default: 'upm'
outputs:
  artifact-path:
    description: Local filesystem path to the signed Unity package tarball (.tgz).
runs:
  using: node24
  main: dist/index.js
